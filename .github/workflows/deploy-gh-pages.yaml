name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Trava contra deleção em massa. Duas vezes (31/07 e 01/08) o Quartz
      # Syncer publicou com as caixas de "despublicar" marcadas e apagou ~110
      # arquivos de content/ de uma vez; na primeira, o site chegou a ir ao ar
      # mutilado. O limite separa bem os dois casos: os pushes destrutivos
      # apagaram 111 e 108 arquivos, e um push normal apaga 0.
      # Para uma remoção grande e intencional, rode o workflow pelo botão
      # "Run workflow" (workflow_dispatch), que não passa por esta checagem.
      - name: Guarda contra deleção em massa
        if: github.event_name == 'push'
        env:
          ANTES: ${{ github.event.before }}
          LIMITE: 50
        run: |
          if [ -z "$ANTES" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ]; then
            echo "Sem commit anterior para comparar — checagem ignorada."
            exit 0
          fi
          APAGADOS=$(git diff --name-only --diff-filter=D "$ANTES" "$GITHUB_SHA" -- content/ | wc -l)
          echo "Arquivos removidos de content/ neste push: $APAGADOS (limite: $LIMITE)"
          if [ "$APAGADOS" -gt "$LIMITE" ]; then
            echo "Primeiros 30 arquivos removidos:"
            git diff --name-only --diff-filter=D "$ANTES" "$GITHUB_SHA" -- content/ | head -30
            echo "::error::$APAGADOS arquivos removidos de content/, acima do limite de $LIMITE. Deploy interrompido para o site não ir ao ar sem conteúdo. Se a remoção foi acidental (Quartz Syncer com as caixas de despublicar marcadas), reverta o commit; se foi intencional, dispare o deploy manualmente em Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Install Quartz Plugins
        run: npx quartz plugin install
      - name: Generate Dynamic Index Tables
        run: python3 scripts/generate_indexes.py
      - name: Generate Course Tables and Carousels
        run: python3 scripts/generate_course_table.py --all
      - name: Build Quartz
        run: npx quartz build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
