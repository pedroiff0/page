name: translation-issues

on:
  schedule:
    - cron: "17 6 * * *"   # todo dia 06:17 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Encontrar paginas sem traducao e abrir issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # slugs que existem em pt-br mas faltam nos outros idiomas
          need=(en es fr)
          # coleta slugs de pt-br (caminho apos "pt-br/"), ignorando index.md
          mapfile -t slugs < <(find content/pt-br -name '*.md' ! -name 'index.md' | sed 's#^content/pt-br/##; s#\.md$##' | sort -u)
          echo "Slugs em pt-br: ${#slugs[@]}"
          open=0
          for slug in "${slugs[@]}"; do
            for lang in "${need[@]}"; do
              f="content/$lang/$slug.md"
              idx="content/$lang/$slug/index.md"
              if [ ! -f "$f" ] && [ ! -f "$idx" ]; then
                title="Tradução em falta: $lang/$slug"
                # evita issue duplicado: pula se ja existir aberto com mesmo titulo
                exists=$(gh issue list --repo "$REPO" --state open --search "$title" --json number --jq 'length' || echo 0)
                if [ "$exists" = "0" ]; then
                  body="A página \`pt-br/$slug\` existe, mas falta a tradução em \`$lang\`. Espelhar o slug em \`$lang/$slug\`."
                  gh issue create --repo "$REPO" --title "$title" --body "$body" --label translation || true
                  open=$((open+1))
                fi
              fi
            done
          done
          echo "Issues abertos nesta varredura: $open"
